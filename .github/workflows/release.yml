name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a GitHub Release (leave unchecked for dry-run artifacts only)
        type: boolean
        default: false
      tag_name:
        description: Release tag when publishing manually (defaults to v<package.json version>)
        type: string
        default: ''
      draft:
        description: Create manual release as draft
        type: boolean
        default: true
      prerelease:
        description: Mark manual release as prerelease
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  verify:
    name: Verify Version & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
      is_draft: ${{ steps.version.outputs.is_draft }}
      should_publish: ${{ steps.version.outputs.should_publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Resolve and validate release version
        id: version
        env:
          RELEASE_INPUT_PUBLISH: ${{ inputs.publish_release }}
          RELEASE_INPUT_TAG_NAME: ${{ inputs.tag_name }}
          RELEASE_INPUT_PRERELEASE: ${{ inputs.prerelease }}
          RELEASE_INPUT_DRAFT: ${{ inputs.draft }}
        run: node scripts/verify-release-version.mjs --github-output

      - name: Configure git defaults for test repos
        run: |
          git config --global user.name "AhaStudio CI"
          git config --global user.email "ci@ahastudio.local"
          git config --global init.defaultBranch main
          git config --global core.autocrlf input
          git config --global core.longpaths true

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run fast test suite
        run: npm run test:fast

  package:
    name: Package (${{ matrix.label }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform_id: win-x64
            label: Windows NSIS x64
            os: windows-latest
          - platform_id: mac-arm64
            label: macOS DMG arm64
            os: macos-latest
          - platform_id: linux-x64
            label: Linux AppImage x64
            os: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache speaker model asset
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/vibe-meet-cache
          key: speaker-model-campplus-v1

      - name: Cache Electron and electron-builder downloads
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/electron-cache
            ${{ runner.temp }}/electron-builder-cache
          key: electron-builder-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-builder-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Fetch speaker ONNX model (strict)
        env:
          VIBE_MEET_CACHE_DIR: ${{ runner.temp }}/vibe-meet-cache
        run: node scripts/fetch-speaker-model.mjs

      - name: Build renderer and Electron main
        env:
          VIBE_MEET_CACHE_DIR: ${{ runner.temp }}/vibe-meet-cache
        run: npm run build

      - name: Package Windows NSIS installer
        if: matrix.platform_id == 'win-x64'
        shell: pwsh
        env:
          electron_config_cache: ${{ runner.temp }}/electron-cache
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if (-not [string]::IsNullOrEmpty($env:WIN_CSC_LINK) -and -not [string]::IsNullOrEmpty($env:WIN_CSC_KEY_PASSWORD)) {
            $env:CSC_LINK = $env:WIN_CSC_LINK
            $env:CSC_KEY_PASSWORD = $env:WIN_CSC_KEY_PASSWORD
            Write-Host "Signing Windows installer with configured WIN_CSC_LINK certificate."
          } else {
            $env:CSC_IDENTITY_AUTO_DISCOVERY = 'false'
            Write-Host "::warning::Windows installer built unsigned (configure WIN_CSC_LINK and WIN_CSC_KEY_PASSWORD secrets to enable code signing)."
          }
          npx electron-builder --win nsis --x64 --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package macOS arm64 DMG
        if: matrix.platform_id == 'mac-arm64'
        shell: bash
        env:
          electron_config_cache: ${{ runner.temp }}/electron-cache
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          if [ -n "${MAC_CSC_LINK:-}" ] && [ -n "${MAC_CSC_KEY_PASSWORD:-}" ]; then
            export CSC_LINK="$MAC_CSC_LINK"
            export CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD"
            for var in APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER; do
              if [ -z "${!var:-}" ]; then
                unset "$var"
              fi
            done
            echo "Signing macOS arm64 DMG with configured MAC_CSC_LINK certificate."
            npx electron-builder --mac dmg --arm64 --publish never
            node scripts/verify-macos-signing.mjs
          else
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            echo "::warning::macOS arm64 DMG built unsigned (configure MAC_CSC_LINK and MAC_CSC_KEY_PASSWORD secrets to enable signing & verify-macos-signing.mjs)."
            npx electron-builder --mac dmg --arm64 --publish never
          fi

      - name: Package Linux x64 AppImage
        if: matrix.platform_id == 'linux-x64'
        shell: bash
        env:
          electron_config_cache: ${{ runner.temp }}/electron-cache
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
        run: |
          set -euo pipefail
          npx electron-builder --linux AppImage --x64 --publish never

      - name: Stage distributable installers
        run: node scripts/stage-release-artifacts.mjs release "${{ runner.temp }}/release-artifacts"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.platform_id }}
          path: ${{ runner.temp }}/release-artifacts
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    needs:
      - verify
      - package
    if: needs.verify.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download all installer artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: installer-*
          merge-multiple: true
          path: release-assets

      - name: Generate checksums and publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          IS_PRERELEASE: ${{ needs.verify.outputs.is_prerelease }}
          IS_DRAFT: ${{ needs.verify.outputs.is_draft }}
          TARGET_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          rm -f release-assets/SHA256SUMS.txt
          (
            cd release-assets
            LC_ALL=C sha256sum -- * > ../SHA256SUMS.txt
          )
          mv SHA256SUMS.txt release-assets/SHA256SUMS.txt

          assets=(release-assets/*)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets found to publish." >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; uploading updated assets."
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            args=(
              release create "$RELEASE_TAG"
              "${assets[@]}"
              --title "AhaStudio $RELEASE_TAG"
              --generate-notes
            )
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              args+=(--target "$TARGET_SHA")
            fi
            if [ "$IS_PRERELEASE" = "true" ]; then
              args+=(--prerelease)
            fi
            if [ "$IS_DRAFT" = "true" ]; then
              args+=(--draft)
            fi
            gh "${args[@]}"
          fi

          {
            echo "## Published Release \`$RELEASE_TAG\`"
            echo ""
            echo "### SHA-256 Checksums"
            echo '```text'
            cat release-assets/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
